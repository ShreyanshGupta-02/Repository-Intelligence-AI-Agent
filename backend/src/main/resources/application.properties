# ============================================================
# Repository Intelligence AI Agent — Application Configuration
# ============================================================
# All secrets are read from environment variables (populated via .env file
# loaded at startup). NEVER hardcode credentials here.
# ============================================================

spring.application.name=repository_ai

# ======================== Server ========================
server.port=8080
server.servlet.context-path=/api

# ======================== Database (Neon PostgreSQL) ========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================== JPA / Hibernate ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true



# ======================== Groq (via OpenAI-compatible API) ========================
# Groq is used ONLY for chat/completions (answer generation), NOT for embeddings.
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.3
# Disable OpenAI embeddings auto-configuration since we use local Ollama embeddings
spring.ai.openai.embedding.enabled=false
# Disable Ollama chat auto-configuration since we use Groq for chat/completions
spring.ai.ollama.chat.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration

# ======================== Ollama (Local Embeddings) ========================
# Ollama runs locally with nomic-embed-text for embedding generation.
# Groq does NOT provide embedding models — Ollama is used instead.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ======================== PGVector Store ========================
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
# ======================== Clone Configuration ========================
# Maximum repository size in KB before cloning is rejected (default: 500MB)
app.clone.max-repo-size-kb=512000
# Temp directory prefix for cloned repos
app.clone.temp-dir-prefix=repo-clone-

# ======================== Parser Configuration ========================
# Maximum file size in bytes before a file is skipped (default: 500KB)
app.parser.max-file-size-bytes=512000

# ======================== Logging ========================
logging.level.root=INFO
logging.level.com.github.repository_ai=DEBUG
logging.level.org.springframework.ai=INFO
